<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RentaTools - Sistema de Gestión</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>

    <div id="auth-wrapper">
        <div id="login-container" class="auth-card">
            <h1>Bienvenido</h1>
            <p>Ingresa para gestionar tus herramientas</p>
            <form id="login-form">
                <div class="input-group">
                    <label>Correo Electrónico</label>
                    <input type="email" id="email" required placeholder="tu@correo.com">
                </div>
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" id="password" required placeholder="••••••••">
                </div>
                <button type="submit" class="btn-primary">Iniciar Sesión</button>
                <p style="margin-top:15px;">¿No tienes cuenta? <a href="#" onclick="toggleAuth(true)">Regístrate</a></p>
            </form>
        </div>

        <div id="register-container" class="auth-card" style="display: none;">
            <h1>Crear Cuenta</h1>
            <p>Regístrate como Cliente o Proveedor</p>
            <form id="register-form">
                <div style="display: flex; gap: 10px; margin-bottom: 0px;">
                    <div class="input-group">
                        <input type="text" id="reg-nombre" placeholder="Nombre" required>
                    </div>
                    <div class="input-group">
                        <input type="text" id="reg-apellido" placeholder="Apellido" required>
                    </div>
                </div>
                
                <div class="input-group">
                    <input type="email" id="reg-correo" placeholder="Correo electrónico" required>
                </div>
                <div class="input-group">
                    <input type="password" id="reg-pass" placeholder="Contraseña" required>
                </div>
                <div class="input-group">
                    <label>Rol de Usuario</label>
                    <select id="reg-rol">
                        <option value="CLIENTE">Cliente</option>
                        <option value="PROVEEDOR">Proveedor</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Crear Cuenta</button>
                <p style="margin-top:15px;">¿Ya tienes cuenta? <a href="#" onclick="toggleAuth(false)">Inicia Sesión</a></p>
            </form>
        </div>
    </div>

    <div id="dashboard-container" style="display: none; width: 100%;">
        <nav class="navbar">
            <div class="nav-brand">🛠️ RentaTools Pro</div>
            <div class="nav-user">
                <span id="user-info">Cargando...</span>
                <button onclick="logout()" class="btn-logout">Salir</button>
            </div>
        </nav>
        
        <main id="content"></main>
    </div>

    <div id="modal-reserva" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModal()">&times;</span>
            <h2>Confirmar Reserva</h2>
            <p id="reserva-tool-name" style="font-weight: 600; color: var(--primary); margin-bottom: 15px;"></p>
            <form id="reserva-form">
                <input type="hidden" id="reserva-tool-id">
                <div class="input-group">
                    <label>Fecha de Inicio</label>
                    <input type="date" id="fecha-inicio" required>
                </div>
                <div class="input-group">
                    <label>Fecha de Devolución</label>
                    <input type="date" id="fecha-fin" required>
                </div>
                <button type="submit" class="btn-primary">Confirmar Alquiler</button>
            </form>
        </div>
    </div>

    <div id="modal-herramienta" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="cerrarModalHerramienta()">&times;</span>
            <h2>Publicar Nueva Herramienta</h2>
            <form id="herramienta-form" style="margin-top:15px;">
                <div class="input-group">
                    <label>Nombre de la Herramienta</label>
                    <input type="text" id="h-nombre" placeholder="Ej: Taladro Percutor" required>
                </div>
                <div class="input-group">
                    <label>Descripción</label>
                    <input type="text" id="h-desc" placeholder="Detalles técnicos..." required>
                </div>
                <div style="display: flex; gap: 10px;">
                    <div class="input-group">
                        <label>Precio por Día</label>
                        <input type="number" id="h-precio" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="input-group">
                        <label>Stock Inicial</label>
                        <input type="number" id="h-stock" placeholder="1" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary" style="background:var(--success);">Guardar y Publicar</button>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
